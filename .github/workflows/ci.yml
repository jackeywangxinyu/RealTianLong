# ============================================================
#  CI：核心零依赖 + 全量（学习层、RL、Neo4j 双后端契约）
#  学习层依赖版本由 constraints.txt 锁定（Colab 笔记本同用一份）；torch 用 CPU 轮子
# ============================================================
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心零依赖（只装 dev）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      # 学习层、RL、LangGraph、Neo4j 用例在缺依赖时整模块跳过：内核、认知、持久化契约（内存后端）必须独立通过
      - run: pytest -q -p no:cacheprovider

  full:
    name: 全量（learn + rl + agents + Neo4j）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-throwaway-password   # 只存在于这次 CI 的一次性容器
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-throwaway-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-throwaway-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -c constraints.txt -e ".[all,dev]"
      - run: ruff check src tests scripts
      # 含笔记本与生成器一致性、C03–C05 单元格行为、部署包 C02、断点续训逐位一致
      - run: pytest -q -p no:cacheprovider
